[pytest]
testpaths = tests
python_files = test_*.py
# Default options:
# - quiet mode
# - generate JUnit XML and HTML reports at the specified locations
# - self-contained HTML ensures CSS/JS embedded for portability
addopts =
    -q
    --junitxml=reports/junit/backend.xml
    --html=reports/html/backend/index.html
    --self-contained-html
