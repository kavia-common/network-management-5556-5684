[flake8]
# Exclude third-party packages and virtualenv from linting to avoid external errors
exclude =
    .venv,
    venv,
    env,
    .env,
    build,
    dist,
    htmlcov,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    interfaces,
    docs,
    */site-packages/*

# Reasonable max line length
max-line-length = 100

# Ignore rules commonly triggered by third-party deps or tests
# - F401: imported but unused (allowed in __init__ and tests sometimes)
# - F403/F405: star imports in third-party libs triggered during CI lints
# - F811: redefinition (seen inside third-party pkgs)
# - F821: undefined name (seen in vendor python2-compat code in dependencies)
# - F841: local variable assigned but not used (tests may use with pytest)
# - E203: whitespace before ':' (black compatibility)
# - W503: line break before binary operator (black compatibility)
ignore = F401,F403,F405,F811,F821,F841,E203,W503

# Only lint our source and tests paths
filename =
    app/*.py,
    app/**/*.py,
    tests/*.py,
    tests/**/*.py
